<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f1eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #333;
        }

        .image-box {
            width: 100%;
            height: 500px;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            margin-bottom: 25px;
            background: #ddd;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px) saturate(100%);
            transition: filter 0.2s;
        }

        .controls {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            margin-bottom: 8px;
            color: #444;
        }

        input[type="range"] {
            width: 100%;
        }

        @media (max-width: 600px) {
            .image-box {
                height: 350px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Focus</h1>

        <div class="image-box">
            <img id="mainImage" src="tylermugshot.jpg" alt="tyler">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="focusSlider">Focus</label>
                <input type="range" id="focusSlider" min="0" max="12" value="8">
            </div>

            <div class="control-group">
                <label for="saturationSlider">Saturation</label>
                <input type="range" id="saturationSlider" min="0" max="200" value="100">
            </div>
        </div>
    </div>

    <script>
        let focusSlider = document.getElementById("focusSlider");
        let saturationSlider = document.getElementById("saturationSlider");
        let mainImage = document.getElementById("mainImage");

        function updateImage() {
            let blurValue = focusSlider.value;
            let saturationValue = saturationSlider.value;

            mainImage.style.filter =
                "blur(" + blurValue + "px) saturate(" + saturationValue + "%)";
        }

        focusSlider.oninput = updateImage;
        saturationSlider.oninput = updateImage;
    </script>
</body>
</html>
